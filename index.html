<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Expense Tracker</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/images/favicon.png">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Chart JS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container">

    <!-- LOGO SECTION -->
    <div class="logo-container">
        <img src="assets/images/logo.png" alt="Expense Tracker Logo" class="logo">
        <h1>💰 Expense Tracker</h1>
        <p class="tagline">Track • Analyze • Improve</p>
    </div>

    <!-- TOP CONTROLS -->
    <div class="top-controls">
        <input type="month" id="monthPicker">
        <select id="sortOption">
            <option value="latest">Latest</option>
            <option value="oldest">Oldest</option>
        </select>
        <button id="themeToggle">🌙 Dark Mode</button>
        <button id="resetBtn">Reset All</button>
    </div>

    <!-- DASHBOARD -->
    <div class="dashboard">
        <div class="card">
            <h3>Income</h3>
            <p id="income">₹0</p>
        </div>
        <div class="card">
            <h3>Expense</h3>
            <p id="expense">₹0</p>
        </div>
        <div class="card">
            <h3>Savings</h3>
            <p id="savings">₹0</p>
        </div>
    </div>

    <!-- FORM -->
    <div class="form">
        <select id="type">
            <option value="">Choose Type</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
        </select>

        <select id="category">
            <option value="">Choose Category</option>
            <option value="Salary">Salary</option>
            <option value="Food">Food</option>
            <option value="Shopping">Shopping</option>
            <option value="Travel">Travel</option>
            <option value="Bills">Bills</option>
            <option value="Other">Other</option>
        </select>

        <input type="text" id="desc" placeholder="Description">
        <input type="number" id="amount" placeholder="Amount">
        <input type="date" id="date">

        <button id="addBtn">Add</button>
    </div>

    <!-- BUDGET -->
    <div class="budget-section">
        <input type="number" id="budgetInput" placeholder="Set Monthly Budget">
        <button id="setBudgetBtn">Set Budget</button>
        <p id="budgetInfo"></p>
    </div>

    <h2>📋 Records</h2>
    <ul id="transactionList"></ul>

    <!-- CHART -->
    <div class="chart-box">
        <canvas id="financeChart"></canvas>
    </div>

    <!-- AI SUMMARY -->
    <div class="ai-section">
        <h3>🤖 AI Financial Summary</h3>
        <p id="aiText"></p>
    </div>

    <!-- AI CHAT BOX -->
    <div class="ai-chat">
        <h3>💬 Ask AI</h3>
        <div class="chat-input">
            <input type="text" id="aiQuestion" placeholder="Ask about saving, budget, food...">
            <button id="askBtn">Ask</button>
        </div>
        <p id="aiResponse"></p>
    </div>

</div>

<script src="js/script.js"></script>
</body>
</html>
